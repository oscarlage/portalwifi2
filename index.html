<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portal WiFi</title>
  <link rel="stylesheet" href="/assets/css/public-ui.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="page-centered">
  <div class="box">
    <h2>Portal WiFi</h2>
    <p id="status">Verificando autenticação...</p>
    <pre id="log"></pre>
  </div>

  <script>
    if (window.__PORTALWIFI_ROOT_INIT__) {
      console.warn("Root router já inicializado.");
    } else {
      window.__PORTALWIFI_ROOT_INIT__ = true;

      const SUPABASE_URL = "https://kedmyfxtxcfnyftkasfg.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_MrWt1zkvKjRgy0xWnEcVpA_SBJ7PSFO";
      
      const logBox = document.getElementById("log");
      const statusBox = document.getElementById("status");

      function setStatus(text, cls = "") {
        statusBox.textContent = text;
        statusBox.className = cls;
      }

      function addLog(obj) {
        const txt = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
        logBox.textContent += (logBox.textContent ? "\n" : "") + txt;
        console.log(obj);
      }

      function clearTenantSession() {
        try {
          sessionStorage.removeItem("tenant_id");
          sessionStorage.removeItem("tenant_role");
          sessionStorage.removeItem("tenant_unit_id");
          sessionStorage.removeItem("portalwifi.authContext");
          sessionStorage.removeItem("portalwifi.tenantMemberships");
          localStorage.removeItem("portalwifi.activeTenantId");
          localStorage.removeItem("portalwifi.activeTenantName");
          localStorage.removeItem("portalwifi.activeTenantSlug");
        } catch (e) {
          console.warn("Falha ao limpar sessionStorage:", e);
        }
      }

      async function loadPermissionsModule() {
        return import("/assets/js/core/permissions.js");
      }

      function requiresPasswordSetup(profile) {
        return !!(profile && (profile.must_change_password === true || profile.password_reset_required === true));
      }

      function redirectToPasswordChange() {
        window.location.replace("/reset-password.html");
      }

      function persistAccessContext(access) {
        sessionStorage.setItem("portalwifi.authContext", JSON.stringify({
          scope: access.scope,
          platformRole: access.platformRole,
          tenantRole: access.tenantRole,
          canAccessGlobalAdmin: access.canAccessGlobalAdmin,
          canAccessTenantAdmin: access.canAccessTenantAdmin
        }));
        sessionStorage.setItem("portalwifi.tenantMemberships", JSON.stringify(access.memberships || []));
      }

      async function hydrateActiveTenant(tenantId) {
        if (!tenantId) return;

        try {
          const { data } = await sb
            .from("tenants")
            .select("id,name,slug")
            .eq("id", tenantId)
            .maybeSingle();

          localStorage.setItem("portalwifi.activeTenantId", tenantId);

          if (data?.name) {
            localStorage.setItem("portalwifi.activeTenantName", data.name);
          }

          if (data?.slug) {
            localStorage.setItem("portalwifi.activeTenantSlug", data.slug);
          }
        } catch (e) {
          console.warn("Falha ao hidratar tenant ativo:", e);
          localStorage.setItem("portalwifi.activeTenantId", tenantId);
        }
      }

      async function signOutAndRedirect(reason = "") {
        try {
          clearTenantSession();
          await sb.auth.signOut();
        } catch (e) {
          console.error("Erro ao encerrar sessão:", e);
        }

        const target = reason
          ? `/login.html?error=${encodeURIComponent(reason)}`
          : "/login.html";

        window.location.replace(target);
      }

      if (!window.__PORTAL_SUPABASE_CLIENT__) {
        window.__PORTAL_SUPABASE_CLIENT__ = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );
      }

      const sb = window.__PORTAL_SUPABASE_CLIENT__;

      async function init() {
        try {
          const permissions = await loadPermissionsModule();
          setStatus("Verificando sessão...");

          const { data: sessionData, error: sessionError } = await sb.auth.getSession();
          addLog({
            step: "session",
            hasSession: !!sessionData?.session,
            sessionError: sessionError ? sessionError.message : null
          });

          if (sessionError) {
            setStatus("Falha ao ler sessão. Redirecionando para login...", "err");
            setTimeout(() => {
              signOutAndRedirect("session_error");
            }, 500);
            return;
          }

          const session = sessionData.session;

          if (!session || !session.user) {
            setStatus("Sem sessão. Redirecionando para login...");
            setTimeout(() => {
              window.location.replace("/login.html");
            }, 500);
            return;
          }

          const userId = session.user.id;

          setStatus("Consultando perfil...");

          const { data: profile, error: profileError } = await sb
            .from("profiles")
            .select("user_id,email,full_name,status,is_platform_user,platform_role,must_change_password,password_reset_required")
            .eq("user_id", userId)
            .single();

          addLog({
            step: "profile",
            profile,
            profileError: profileError ? profileError.message : null
          });

          if (profileError || !profile) {
            setStatus("Falha: perfil não encontrado. Redirecionando...", "err");
            setTimeout(() => {
              signOutAndRedirect("profile_not_found");
            }, 700);
            return;
          }

          if (profile.status === "pending" && requiresPasswordSetup(profile)) {
            setStatus("Primeiro acesso ou reset de senha pendente. Redirecionando para troca de senha...", "ok");
            setTimeout(() => {
              redirectToPasswordChange();
            }, 700);
            return;
          }

          if (profile.status !== "active") {
            setStatus("Falha: usuário inativo, status = " + profile.status + ". Redirecionando...", "err");
            setTimeout(() => {
              signOutAndRedirect("user_inactive");
            }, 900);
            return;
          }

          const { data: memberships, error: membershipError } = await sb
            .from("tenant_members")
            .select("tenant_id,role,is_active,unit_id")
            .eq("user_id", userId)
            .eq("is_active", true);

          addLog({
            step: "membership",
            memberships,
            membershipError: membershipError ? membershipError.message : null
          });

          if (membershipError) {
            setStatus("Falha ao consultar vínculos. Redirecionando...", "err");
            setTimeout(() => {
              signOutAndRedirect("membership_error");
            }, 900);
            return;
          }

          const access = permissions.resolveAccessContext(profile, memberships || []);
          persistAccessContext(access);

          if (permissions.canAccessGlobalAdmin(profile, memberships || [])) {
            clearTenantSession();
            setStatus("Usuário global detectado. Redirecionando para platform.html...", "ok");
            setTimeout(() => {
              window.location.replace("/platform.html");
            }, 800);
            return;
          }

          if (!permissions.canAccessTenantAdmin(profile, memberships || [])) {
            setStatus("Falha: sem vínculo ativo de tenant. Redirecionando...", "err");
            setTimeout(() => {
              signOutAndRedirect("no_active_membership");
            }, 900);
            return;
          }

          const membership = access.memberships[0];
          sessionStorage.setItem("tenant_id", membership.tenant_id);
          sessionStorage.setItem("tenant_role", membership.role);
          if (membership.unit_id) {
            sessionStorage.setItem("tenant_unit_id", membership.unit_id);
          }

          await hydrateActiveTenant(membership.tenant_id);

          setStatus("Usuário tenant detectado. Redirecionando para estabelecimento...", "ok");
          setTimeout(() => {
            window.location.replace(`/estabelecimento/index.html?tenant_id=${encodeURIComponent(membership.tenant_id)}`);
          }, 800);

        } catch (err) {
          addLog({
            step: "fatal_error",
            message: err.message,
            stack: err.stack
          });
          setStatus("Erro fatal. Redirecionando para login...", "err");
          setTimeout(() => {
            signOutAndRedirect("unexpected_error");
          }, 1000);
        }
      }

      init();
    }
  </script>
</body>
</html>
