<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexora Cliente Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/estabelecimento.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header-block">
        <div class="brand-title" id="workspaceBrandTitle">Cliente</div>
        <div class="brand-sub">Gestão operacional isolada do cliente</div>
      </div>

      <nav class="side-nav" aria-label="Menu do cliente">
        <button class="nav-item active" data-page="/estabelecimento/home.html" type="button">Dashboard</button>
        <button class="nav-item" data-page="/estabelecimento/clientes.html" type="button">Leads &amp; clientes</button>
        <button class="nav-item" data-page="/estabelecimento/campanhas.html" type="button">Campanhas</button>
        <button class="nav-item" data-page="/estabelecimento/configuracoes.html" type="button">Configurações</button>
        <button class="nav-item" data-page="/estabelecimento/relatorios.html" type="button">Relatórios &amp; métricas</button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Visão geral do movimento do Wi-Fi.</p>
        </div>
        <div class="topbar-actions">
          <div class="user-menu" id="userMenu">
            <button type="button" class="user-trigger" id="userMenuTrigger" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenuDropdown">
              <span class="user-avatar" aria-hidden="true">U</span>
              <span class="user-trigger-copy">
                <strong>Conta</strong>
                <small id="userMenuLabel">Cliente</small>
              </span>
            </button>

            <div class="user-dropdown hidden" id="userMenuDropdown" role="menu" aria-label="Menu da conta">
              <button type="button" class="user-dropdown-item" data-user-action="settings" role="menuitem">Configurações</button>
              <button type="button" class="user-dropdown-item" data-user-action="change-password" role="menuitem">Mudar senha</button>
              <button type="button" class="user-dropdown-item danger" data-user-action="logout" role="menuitem">Encerrar sessão</button>
            </div>
          </div>
        </div>
      </header>

      <div class="frame-wrap">
        <iframe id="contentFrame" title="Conteúdo do cliente"></iframe>
      </div>
    </main>
  </div>

  <script src="/assets/js/estabelecimento.js"></script>
</body>
</html>
