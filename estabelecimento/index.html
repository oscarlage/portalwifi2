<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexora Tenant Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/estabelecimento.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <div class="brand-title">Tenant Workspace</div>
        <div class="brand-sub">Gestão operacional isolada do tenant</div>
      </div>

      <div class="side-tenant-box">
        <div class="side-tenant-label">Tenant ativo</div>
        <div class="side-tenant-value" id="tenantName">Carregando...</div>
        <div class="brand-sub" id="tenantSlug">Preparando contexto...</div>
      </div>

      <nav class="side-nav" aria-label="Menu do tenant">
        <button class="nav-item active" data-page="/estabelecimento/home.html" type="button">Dashboard do tenant</button>
        <button class="nav-item" data-page="/estabelecimento/clientes.html" type="button">Leads &amp; clientes</button>
        <button class="nav-item" data-page="/estabelecimento/campanhas.html" type="button">Campanhas</button>
        <button class="nav-item" data-page="/estabelecimento/configuracoes.html" type="button">Configurações do tenant</button>
        <button class="nav-item" data-page="/estabelecimento/relatorios.html" type="button">Relatórios &amp; métricas</button>
      </nav>

      <div class="side-footer">
        <div class="side-tenant-box">
          <div class="side-tenant-label">Contexto</div>
          <div class="side-tenant-value" id="tenantNameFooter">Aguardando...</div>
        </div>
        <a href="/logout.html">Encerrar sessão</a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Visão geral do movimento do Wi-Fi.</p>
        </div>
        <div class="session-pill">
          <span class="dot"></span>
          <span>Contexto do tenant</span>
        </div>
      </header>

      <div class="frame-wrap">
        <iframe id="contentFrame" title="Conteúdo do tenant"></iframe>
      </div>
    </main>
  </div>

  <script src="/assets/js/estabelecimento.js"></script>
</body>
</html>
