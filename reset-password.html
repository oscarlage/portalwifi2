<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal WiFi - Alterar senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --line:rgba(15,23,42,.12);
      --primary:#0f766e;
      --danger:#dc2626;
      --success:#15803d;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,#eef5ff 0%,#f8fafc 100%);
      color:var(--text);
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      width:min(100%,520px);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      padding:28px;
      box-shadow:0 20px 50px rgba(15,23,42,.08);
    }
    h1{margin:0 0 8px;font-size:28px}
    p{margin:0 0 18px;color:var(--muted);line-height:1.5}
    label{display:block;margin:14px 0 6px;font-weight:700;font-size:14px}
    input{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px 14px;
      font:inherit;
    }
    button{
      width:100%;
      margin-top:18px;
      border:0;
      border-radius:12px;
      padding:12px 14px;
      font:inherit;
      font-weight:700;
      cursor:pointer;
      background:var(--primary);
      color:#fff;
    }
    .status{
      margin-top:14px;
      min-height:22px;
      font-size:14px;
      color:var(--muted);
    }
    .status.error{color:var(--danger)}
    .status.success{color:var(--success)}
    .tips{
      margin-top:18px;
      padding:14px;
      border-radius:14px;
      background:#f8fafc;
      border:1px solid var(--line);
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="card">
    <h1>Defina sua nova senha</h1>
    <p>Para concluir o primeiro acesso ou uma redefinição de senha, escolha uma nova senha e confirme abaixo.</p>

    <label for="newPassword">Nova senha</label>
    <input id="newPassword" type="password" autocomplete="new-password" placeholder="Digite a nova senha">

    <label for="confirmPassword">Confirmar nova senha</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repita a nova senha">

    <button id="savePassword" type="button">Salvar nova senha</button>
    <div id="status" class="status"></div>

    <div class="tips">
      Use uma senha forte e diferente da provisória. Após salvar, seu acesso será liberado automaticamente.
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://kedmyfxtxcfnyftkasfg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_MrWt1zkvKjRgy0xWnEcVpA_SBJ7PSFO";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById("status");
    const newPasswordEl = document.getElementById("newPassword");
    const confirmPasswordEl = document.getElementById("confirmPassword");
    const saveButton = document.getElementById("savePassword");

    function setStatus(message, tone = "") {
      statusEl.textContent = message || "";
      statusEl.className = `status ${tone}`.trim();
    }

    function clearStoredTenantContext() {
      sessionStorage.removeItem("tenant_id");
      sessionStorage.removeItem("tenant_role");
      sessionStorage.removeItem("tenant_unit_id");
      sessionStorage.removeItem("portalwifi.authContext");
      sessionStorage.removeItem("portalwifi.tenantMemberships");
      localStorage.removeItem("portalwifi.activeTenantId");
      localStorage.removeItem("portalwifi.activeTenantName");
      localStorage.removeItem("portalwifi.activeTenantSlug");
    }

    async function getSessionUser() {
      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      return data.session?.user || null;
    }

    async function getProfile(userId) {
      const { data, error } = await supabase
        .from("profiles")
        .select("user_id,status,must_change_password,password_reset_required")
        .eq("user_id", userId)
        .single();

      if (error) throw error;
      return data;
    }

    async function activateProfile(userId) {
      const { error } = await supabase
        .from("profiles")
        .update({
          status: "active",
          must_change_password: false,
          password_reset_required: false,
          updated_at: new Date().toISOString()
        })
        .eq("user_id", userId);

      if (error) throw error;
    }

    async function ensurePasswordFlow() {
      const user = await getSessionUser();

      if (!user) {
        window.location.replace("/login.html?error=no_session_for_password_change");
        return null;
      }

      const profile = await getProfile(user.id);

      if (profile.status === "active" && !profile.must_change_password && !profile.password_reset_required) {
        window.location.replace("/");
        return null;
      }

      return { user, profile };
    }

    async function savePassword() {
      const password = newPasswordEl.value;
      const confirmPassword = confirmPasswordEl.value;

      if (!password) {
        setStatus("Informe a nova senha.", "error");
        return;
      }

      if (password.length < 8) {
        setStatus("A nova senha precisa ter pelo menos 8 caracteres.", "error");
        return;
      }

      if (password !== confirmPassword) {
        setStatus("A confirmação de senha não confere.", "error");
        return;
      }

      try {
        saveButton.disabled = true;
        setStatus("Salvando nova senha...");

        const { user } = await ensurePasswordFlow() || {};
        if (!user) return;

        const { error: updateAuthError } = await supabase.auth.updateUser({ password });
        if (updateAuthError) throw updateAuthError;

        await activateProfile(user.id);
        clearStoredTenantContext();

        setStatus("Senha alterada com sucesso. Redirecionando...", "success");
        setTimeout(() => {
          window.location.replace("/");
        }, 900);
      } catch (error) {
        console.error(error);
        setStatus(error.message || "Não foi possível atualizar a senha.", "error");
      } finally {
        saveButton.disabled = false;
      }
    }

    saveButton.addEventListener("click", savePassword);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        savePassword();
      }
    });

    ensurePasswordFlow().catch((error) => {
      console.error(error);
      setStatus(error.message || "Não foi possível validar a sessão para troca de senha.", "error");
    });
  </script>
</body>
</html>
